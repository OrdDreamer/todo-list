{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block title %}{{ object|yesno:"Update,Create" }}Tag{% endblock %}

{% block content %}
<h1 class="mb-4">{{ object|yesno:"Update,Create" }}Tag</h1>
<form method="post">
    {% csrf_token %}
    {{ form|crispy }}
    <div class="mt-3">
        <button type="submit" class="btn btn-primary">Save</button>
        <a href="{% url 'tasks:tag_list' %}" class="btn btn-secondary">Cancel</a>
    </div>
</form>
{% endblock %}
